name: CI

on:
  push:
  pull_request:

jobs:
  testy:
    name: Testy (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Biblioteki systemowe Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Formatowanie Rusta
        run: cargo fmt --check
        working-directory: src-tauri
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - name: Testy Rusta
        run: cargo test
        working-directory: src-tauri

  windows:
    name: Testy i instalator (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Clippy (kod Windows)
        run: cargo clippy -- -D warnings
        working-directory: src-tauri
      - name: Testy Rusta na Windows
        run: cargo test
        working-directory: src-tauri
      - name: Instalator
        run: npm run tauri build
      - uses: actions/upload-artifact@v7
        with:
          name: asystentka-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/asystentka.exe
          if-no-files-found: error
