name: CI

on:
  push:
  pull_request:

# Token CI tylko czyta repozytorium.
permissions:
  contents: read

# Nowy commit w pull requeście anuluje przestarzały przebieg dla tego samego PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  testy:
    name: Testy (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Biblioteki systemowe Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Formatowanie Rusta
        run: cargo fmt --check
        working-directory: src-tauri
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: src-tauri
      - name: Testy Rusta
        run: cargo test --locked
        working-directory: src-tauri

  windows:
    name: Testy i instalator (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - name: Clippy (kod Windows)
        run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: src-tauri
      - name: Testy Rusta na Windows
        run: cargo test --locked
        working-directory: src-tauri
      - name: Instalator
        run: npm run tauri -- build -- --locked
      - uses: actions/upload-artifact@v7
        with:
          name: asystentka-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/asystentka.exe
          if-no-files-found: error
